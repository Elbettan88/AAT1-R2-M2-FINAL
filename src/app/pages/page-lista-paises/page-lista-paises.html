<div class="page-container">
  <div class="page-header">
    <h1>Explorador de Países</h1>
    <p>Busca entre 195 países del mundo</p>
  </div>

  <div class="search-bar">
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="text"
      [(ngModel)]="termino"
      (keyup.enter)="buscar()"
      placeholder="Buscar país... ej: México, Francia, Japón"
      class="search-input"
    />
    @if (termino) {
      <button class="btn-clear" (click)="limpiar()">✕</button>
    }
    <button class="btn-buscar" (click)="buscar()">Buscar</button>
  </div>

  <app-lista-de-paises [busqueda]="busquedaActiva()" />
</div>
