@if (pais) {
  <div class="card" (click)="verDetalles()">
    <div class="card-flag">
      <img [src]="pais.flags.png" [alt]="pais.flags.alt || pais.name.common" />
    </div>
    <div class="card-body">
      <h3 class="card-name">{{ pais.name.common }}</h3>
      <p><span class="label">Capital:</span> {{ pais.capital?.[0] ?? '—' }}</p>
      <p><span class="label">Región:</span> {{ pais.region }}</p>
      <p><span class="label">Población:</span> {{ formatPoblacion(pais.population) }}</p>
    </div>
    <div class="card-footer">
      <button class="btn-detalles" (click)="verDetalles(); $event.stopPropagation()">
        Ver detalles →
      </button>
    </div>
  </div>
}
