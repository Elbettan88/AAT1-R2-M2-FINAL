@if (pais) {
  <!-- El clic en toda la tarjeta también abre el detalle si el usuario lo desea -->
  <div class="card" (click)="verDetalles()">
    <div class="card-flag">
      <img [src]="pais.flags.png" [alt]="pais.flags.alt || pais.name.common" />
    </div>
    <div class="card-body">
      <h3 class="card-name">{{ pais.name.common }}</h3>
      <p><span class="label">Capital:</span> {{ pais.capital?.[0] ?? '—' }}</p>
      <p><span class="label">Región:</span> {{ pais.region }}</p>
      <p><span class="label">Población:</span> {{ formatPoblacion(pais.population) }}</p>
    </div>
    <div class="card-footer">
      <!-- El $event.stopPropagation() previene que el evento 'click' se ejecute dos veces (en el botón y en la tarjeta) -->
      <button class="btn-detalles" (click)="verDetalles(); $event.stopPropagation()">
        Ver detalles →
      </button>
    </div>
  </div>
}

<!-- EXPLICACIÓN PARA EL EQUIPO:
     Si 'mostrarModal' pasa a ser true, insertamos el componente de la alerta en la pantalla.
     Le pasamos la información de nuestro objeto [pais] a su propiedad interna [paisSeleccionado].
     Cuando el modal emita el evento (cerrarModal), respondemos ejecutando nuestra función local cerrarDetalles() -->
@if (mostrarModal) {
  <app-detalle-del-pais 
    [paisSeleccionado]="pais" 
    (cerrarModal)="cerrarDetalles()">
  </app-detalle-del-pais>
}
